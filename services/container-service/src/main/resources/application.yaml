server:
  port: 8083

spring:
  application:
    name: container-service

  datasource:
    url: ${CONTAINER_DB_URL}
    username: ${CONTAINER_DB_USERNAME}
    password: ${CONTAINER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: container_schema
        format_sql: true
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    default-schema: container_schema
    schemas: container_schema
    create-schemas: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always