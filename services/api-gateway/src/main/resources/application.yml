server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-route
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            - id: shipment-service-route
              uri: lb://shipment-service
              predicates:
                - Path=/api/shipments/**

            - id: container-types-route
              uri: lb://container-service
              predicates:
                - Path=/api/container-types/**

            - id: container-allocations-route
              uri: lb://container-service
              predicates:
                - Path=/api/container-allocations/**

            - id: document-service-route
              uri: lb://document-service
              predicates:
                - Path=/api/documents/**

            - id: payment-service-route
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**

            - id: audit-service-route
              uri: lb://audit-service
              predicates:
                - Path=/api/audits/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origin: "${FRONTEND_ORIGIN:http://localhost:5173}"