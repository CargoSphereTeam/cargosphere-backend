server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-route
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            - id: shipment-service-route
              uri: lb://shipment-service
              predicates:
                - Path=/api/shipments/**,/api/admin/shipments/**

            - id: container-types-route
              uri: lb://container-service
              predicates:
                - Path=/api/container-types/**

            - id: container-allocations-route
              uri: lb://container-service
              predicates:
                - Path=/api/container-allocations/**

            - id: document-service-route
              uri: lb://document-service
              predicates:
                - Path=/api/documents/**

            - id: payment-service-route
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**

            - id: audit-service-route
              uri: lb://audit-service
              predicates:
                - Path=/api/audits/**

            - id: auth-service-openapi-route
              uri: lb://auth-service
              predicates:
                - Path=/openapi/auth-service
              filters:
                - SetPath=/v3/api-docs

            - id: shipment-service-openapi-route
              uri: lb://shipment-service
              predicates:
                - Path=/openapi/shipment-service
              filters:
                - SetPath=/v3/api-docs

            - id: container-service-openapi-route
              uri: lb://container-service
              predicates:
                - Path=/openapi/container-service
              filters:
                - SetPath=/v3/api-docs

            - id: document-service-openapi-route
              uri: lb://document-service
              predicates:
                - Path=/openapi/document-service
              filters:
                - SetPath=/v3/api-docs

            - id: payment-service-openapi-route
              uri: lb://payment-service
              predicates:
                - Path=/openapi/payment-service
              filters:
                - SetPath=/v3/api-docs

            - id: audit-service-openapi-route
              uri: lb://audit-service
              predicates:
                - Path=/openapi/audit-service
              filters:
                - SetPath=/v3/api-docs

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

    urls:
      - name: Auth Service
        url: /openapi/auth-service

      - name: Shipment Service
        url: /openapi/shipment-service

      - name: Container Service
        url: /openapi/container-service

      - name: Document Service
        url: /openapi/document-service

      - name: Payment Service
        url: /openapi/payment-service

      - name: Audit Service
        url: /openapi/audit-service

    urls-primary-name: Auth Service

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origin: "${FRONTEND_ORIGIN:http://localhost:5173}"
