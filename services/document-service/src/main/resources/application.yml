server:
  port: 8084

spring:
  application:
    name: document-service

  datasource:
    url: ${DOCUMENT_DB_URL}
    username: ${DOCUMENT_DB_USERNAME}
    password: ${DOCUMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: document_schema
        format_sql: true

  flyway:
    enabled: true
    default-schema: document_schema
    schemas: document_schema
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:cargosphere-auth-service}
  audit-client:
    enabled: ${AUDIT_CLIENT_ENABLED:true}
    base-url: ${AUDIT_SERVICE_URL:http://localhost:8086}
    api-key: ${INTERNAL_AUDIT_API_KEY:}
    connect-timeout: ${AUDIT_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${AUDIT_READ_TIMEOUT:PT3S}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

  packages-to-scan:
    - com.cargosphere.documentservice.controller

  paths-to-match:
    - /api/documents
    - /api/documents/**
