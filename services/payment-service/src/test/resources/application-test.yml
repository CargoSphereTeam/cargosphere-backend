spring:
  datasource:
    url: ${PAYMENT_TEST_DB_URL}
    username: ${PAYMENT_TEST_DB_USERNAME}
    password: ${PAYMENT_TEST_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment_schema
        format_sql: true

  flyway:
    enabled: true
    default-schema: payment_schema
    schemas: payment_schema
    create-schemas: true
    locations: classpath:db/migration

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  jwt:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    issuer: cargosphere-auth-service