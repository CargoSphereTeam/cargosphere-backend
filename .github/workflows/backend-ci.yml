name: CargoSphere Backend CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargosphere-backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - service-registry
          - api-gateway
          - auth-service
          - shipment-service
          - container-service
          - document-service
          - payment-service
          - audit-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        env:
          AUTH_TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
          AUTH_TEST_DB_USERNAME: ${{ secrets.TEST_DB_USERNAME }}
          AUTH_TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

          SHIPMENT_TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
          SHIPMENT_TEST_DB_USERNAME: ${{ secrets.TEST_DB_USERNAME }}
          SHIPMENT_TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

          CONTAINER_TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
          CONTAINER_TEST_DB_USERNAME: ${{ secrets.TEST_DB_USERNAME }}
          CONTAINER_TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

          DOCUMENT_TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
          DOCUMENT_TEST_DB_USERNAME: ${{ secrets.TEST_DB_USERNAME }}
          DOCUMENT_TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

          PAYMENT_TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
          PAYMENT_TEST_DB_USERNAME: ${{ secrets.TEST_DB_USERNAME }}
          PAYMENT_TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

          AUDIT_TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
          AUDIT_TEST_DB_USERNAME: ${{ secrets.TEST_DB_USERNAME }}
          AUDIT_TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_AUDIT_API_KEY: ${{ secrets.INTERNAL_AUDIT_API_KEY }}

          EUREKA_CLIENT_ENABLED: "false"
          SPRING_CLOUD_DISCOVERY_ENABLED: "false"

        run: ./mvnw -B clean test -Dspring.profiles.active=test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-reports
          path: |
            services/${{ matrix.service }}/target/surefire-reports/**
            services/${{ matrix.service }}/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - test-services
      - validate-compose

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Build all backend images
        run: docker compose build --parallel